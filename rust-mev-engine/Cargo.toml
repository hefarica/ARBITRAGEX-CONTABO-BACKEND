[package]
name = "arbitragex-mev-engine"
version = "0.1.0"
edition = "2021"
authors = ["ARBITRAGEX Team"]
description = "MEV Engine Core for ARBITRAGEX SUPREME"

[dependencies]
# Framework asincrónico y servidor web
tokio = { version = "1.32.0", features = ["full"] }
actix-web = "4.4.0"
actix-cors = "0.6.4"
actix-rt = "2.9.0"

# Blockchain y Web3
ethers = { version = "2.0.8", features = ["ws", "rustls"] }
web3 = { version = "0.19.0", features = ["http-rustls", "wasm", "signing"] }
secp256k1 = { version = "0.27.0", features = ["rand"] }
hex = "0.4.3"

# Base de datos y caché
sqlx = { version = "0.7.2", features = ["runtime-tokio-rustls", "postgres", "uuid", "time", "json"] }
redis = { version = "0.23.3", features = ["tokio-comp", "connection-manager"] }
uuid = { version = "1.4.1", features = ["v4", "serde"] }

# Logging y monitoreo
tracing = "0.1.37"
tracing-subscriber = { version = "0.3.17", features = ["env-filter"] }
tracing-appender = "0.2.2"
prometheus = "0.13.3"
prometheus-endpoint = "0.3.3"

# Serialización y configuración
serde = { version = "1.0.188", features = ["derive"] }
serde_json = "1.0.107"
config = "0.13.3"
dotenv = "0.15.0"

# Utilidades
thiserror = "1.0.48"
anyhow = "1.0.75"
async-trait = "0.1.73"
chrono = { version = "0.4.30", features = ["serde"] }
futures = "0.3.28"
reqwest = { version = "0.11.20", features = ["json", "rustls-tls"], default-features = false }
tokio-tungstenite = { version = "0.20.0", features = ["rustls-tls-webpki-roots"] }

# Circuit breaker
governor = "0.6.0"
dashmap = "5.5.3"

[dev-dependencies]
mockall = "0.11.4"
wiremock = "0.5.19"
test-log = "0.2.12"
tokio-test = "0.4.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev.package."*"]
opt-level = 3

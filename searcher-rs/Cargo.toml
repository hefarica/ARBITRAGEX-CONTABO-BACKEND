[package]
name = "searcher-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
web3 = { version = "0.20", features = ["ipc"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.11", features = ["json"] }
num-bigint = "0.4"
rayon = "1.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"


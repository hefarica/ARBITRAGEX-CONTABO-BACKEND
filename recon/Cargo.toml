[package]
name = "recon"
version = "1.0.0"
edition = "2021"
authors = ["ArbitrageX Team"]
description = "ArbitrageX Supreme V3.0 - Blockchain Reconciliation Service"
keywords = ["arbitrage", "mev", "blockchain", "reconciliation"]
categories = ["finance", "network-programming"]

[[bin]]
name = "recon"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
ethers = { version = "2.0", features = ["rustls", "ws"] }
web3 = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json", "migrate"] }
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }
rust_decimal = { version = "1.33", features = ["serde-float"] }
bigdecimal = "0.4"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
dashmap = "0.5"
config = "0.13"
dotenvy = "0.15"

[dev-dependencies]
tokio-test = "0.4"

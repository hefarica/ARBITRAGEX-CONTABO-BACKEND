[package]
name = "recon"
version = "1.0.0"
edition = "2021"
authors = ["ArbitrageX Team"]
description = "ArbitrageX Supreme V3.0 - Reconciliation Service for P&L Analysis and Database Synchronization"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json", "migrate"] }
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
rust_decimal = { version = "1.33", features = ["serde-float"] }
ethers = { version = "2.0", features = ["rustls", "ws"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
async-trait = "0.1"
thiserror = "1.0"

[dev-dependencies]
tokio-test = "0.4"

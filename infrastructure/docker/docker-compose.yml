version: '3.8'

services:
  # Base de datos principal PostgreSQL
  postgres:
    image: postgres:15
    container_name: arbitragex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: arbitragex
      POSTGRES_PASSWORD: ${DB_PASSWORD:-securepwd123}  # Usar variable de entorno o valor predeterminado
      POSTGRES_DB: arbitragexdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arbitragex"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cache Redis para datos en tiempo real
  redis:
    image: redis:7-alpine
    container_name: arbitragex-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-secureredis123}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Rust MEV Engine Core
  mev-engine:
    build:
      context: ./rust-mev-engine
      dockerfile: Dockerfile
    container_name: arbitragex-mev-engine
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      - RUST_LOG=info
      - DATABASE_URL=postgres://arbitragex:${DB_PASSWORD:-securepwd123}@postgres:5432/arbitragexdb
      - REDIS_URL=redis://:${REDIS_PASSWORD:-secureredis123}@redis:6379/0
      - RPC_VERIFICATION_ENABLED=true  # Habilitar verificación real de endpoints RPC
    volumes:
      - ./rust-mev-engine:/app
      - rust_target:/app/target
    ports:
      - "8000:8000"  # API REST interna

  # Node.js Selector API
  selector-api:
    build:
      context: ./nodejs-selector-api
      dockerfile: Dockerfile
    container_name: arbitragex-selector-api
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - mev-engine
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://arbitragex:${DB_PASSWORD:-securepwd123}@postgres:5432/arbitragexdb
      - REDIS_URL=redis://:${REDIS_PASSWORD:-secureredis123}@redis:6379/0
      - MEV_ENGINE_URL=http://mev-engine:8000
    volumes:
      - ./nodejs-selector-api:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"  # API REST externa
      - "3001:3001"  # WebSocket Server

  # Nginx como reverse proxy y capa de seguridad
  nginx:
    image: nginx:1.25-alpine
    container_name: arbitragex-nginx
    restart: unless-stopped
    depends_on:
      - selector-api
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/logs:/var/log/nginx
    ports:
      - "80:80"
      - "443:443"

  # Prometheus para monitoreo (opcional en entorno de desarrollo)
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: arbitragex-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"

  # Grafana para visualización (opcional en entorno de desarrollo)
  grafana:
    image: grafana/grafana:10.0.3
    container_name: arbitragex-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3100:3000"

volumes:
  postgres_data:
  redis_data:
  rust_target:
  node_modules:
  prometheus_data:
  grafana_data:

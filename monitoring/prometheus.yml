# ArbitrageX Prometheus Configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'arbitragex-monitor'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - "alerts.rules"

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'arbitragex'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: '/api/v1/metrics/custom'
    params:
      include: ['opportunities', 'executions', 'pnl']

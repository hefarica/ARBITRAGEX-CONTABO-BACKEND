# ArbitrageX Supreme V3.0 - Monitoring & Observability
# Paquete Operativo Completo - Prometheus, Grafana, Alerting

# =====================================================
# PROMETHEUS CONFIGURATION
# Ubicación: monitoring/prometheus.yml
# =====================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'arbitragex-prod'
    environment: 'production'

rule_files:
  - "alert_rules.yml"
  - "recording_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # ArbitrageX Backend Services
  - job_name: 'arbitragex-api'
    static_configs:
      - targets: ['api-server:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    
  - job_name: 'arbitragex-searcher'
    static_configs:
      - targets: ['searcher-rs:8081']
    metrics_path: '/metrics'
    scrape_interval: 5s  # High frequency for opportunities
    
  - job_name: 'arbitragex-selector'
    static_configs:
      - targets: ['selector-api:8082']
    metrics_path: '/metrics'
    scrape_interval: 10s
    
  - job_name: 'arbitragex-recon'
    static_configs:
      - targets: ['recon:8083']
    metrics_path: '/metrics'
    scrape_interval: 15s
    
  - job_name: 'arbitragex-relays-client'
    static_configs:
      - targets: ['relays-client:8084']
    metrics_path: '/metrics'
    scrape_interval: 10s
    
  - job_name: 'arbitragex-sim-ctl'
    static_configs:
      - targets: ['sim-ctl:8085']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Infrastructure
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s
    
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 15s
    
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 15s

  # Cloudflare Workers (via webhook)
  - job_name: 'cloudflare-workers'
    static_configs:
      - targets: ['arbitragex.workers.dev']
    metrics_path: '/metrics'
    scheme: https
    scrape_interval: 30s

# =====================================================
# GRAFANA DASHBOARDS
# Ubicación: monitoring/dashboards/arbitragex-backend.json
# =====================================================

arbitragex_backend_dashboard: |
  {
    "dashboard": {
      "id": null,
      "title": "ArbitrageX Supreme V3.0 - Backend",
      "tags": ["arbitragex", "backend", "rust"],
      "timezone": "UTC",
      "panels": [
        {
          "id": 1,
          "title": "Opportunities Discovery Rate",
          "type": "stat",
          "targets": [
            {
              "expr": "rate(arbitragex_opportunities_discovered_total[5m])",
              "legendFormat": "Opportunities/sec"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "thresholds": {
                "steps": [
                  {"color": "red", "value": 0},
                  {"color": "yellow", "value": 1},
                  {"color": "green", "value": 5}
                ]
              }
            }
          }
        },
        {
          "id": 2,
          "title": "Execution Success Rate",
          "type": "stat",
          "targets": [
            {
              "expr": "rate(arbitragex_executions_successful_total[5m]) / rate(arbitragex_executions_total[5m]) * 100",
              "legendFormat": "Success Rate %"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "steps": [
                  {"color": "red", "value": 0},
                  {"color": "yellow", "value": 80},
                  {"color": "green", "value": 95}
                ]
              }
            }
          }
        },
        {
          "id": 3,
          "title": "Profit Generated",
          "type": "stat",
          "targets": [
            {
              "expr": "increase(arbitragex_profit_total_usd[1h])",
              "legendFormat": "Hourly Profit USD"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "thresholds": {
                "steps": [
                  {"color": "red", "value": 0},
                  {"color": "yellow", "value": 100},
                  {"color": "green", "value": 1000}
                ]
              }
            }
          }
        },
        {
          "id": 4,
          "title": "API Response Times",
          "type": "graph",
          "targets": [
            {
              "expr": "histogram_quantile(0.50, rate(arbitragex_http_request_duration_seconds_bucket[5m]))",
              "legendFormat": "P50"
            },
            {
              "expr": "histogram_quantile(0.95, rate(arbitragex_http_request_duration_seconds_bucket[5m]))",
              "legendFormat": "P95"
            },
            {
              "expr": "histogram_quantile(0.99, rate(arbitragex_http_request_duration_seconds_bucket[5m]))",
              "legendFormat": "P99"
            }
          ],
          "yAxes": [
            {
              "unit": "s",
              "min": 0
            }
          ]
        },
        {
          "id": 5,
          "title": "Active WebSocket Connections",
          "type": "graph",
          "targets": [
            {
              "expr": "arbitragex_websocket_connections_active",
              "legendFormat": "Active Connections"
            }
          ]
        },
        {
          "id": 6,
          "title": "Database Connection Pool",
          "type": "graph",
          "targets": [
            {
              "expr": "arbitragex_db_connections_active",
              "legendFormat": "Active"
            },
            {
              "expr": "arbitragex_db_connections_idle",
              "legendFormat": "Idle"
            },
            {
              "expr": "arbitragex_db_connections_max",
              "legendFormat": "Max"
            }
          ]
        },
        {
          "id": 7,
          "title": "Memory Usage",
          "type": "graph",
          "targets": [
            {
              "expr": "process_resident_memory_bytes{job=~'arbitragex-.*'}",
              "legendFormat": "{{job}}"
            }
          ],
          "yAxes": [
            {
              "unit": "bytes"
            }
          ]
        },
        {
          "id": 8,
          "title": "CPU Usage",
          "type": "graph",
          "targets": [
            {
              "expr": "rate(process_cpu_seconds_total{job=~'arbitragex-.*'}[5m]) * 100",
              "legendFormat": "{{job}}"
            }
          ],
          "yAxes": [
            {
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          ]
        },
        {
          "id": 9,
          "title": "Error Rate by Service",
          "type": "graph",
          "targets": [
            {
              "expr": "rate(arbitragex_http_requests_total{status=~'5..'}[5m])",
              "legendFormat": "{{job}} - {{status}}"
            }
          ]
        },
        {
          "id": 10,
          "title": "Top Profitable Pairs",
          "type": "table",
          "targets": [
            {
              "expr": "topk(10, sum by (pair) (increase(arbitragex_profit_by_pair_usd[1h])))",
              "format": "table"
            }
          ]
        }
      ],
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "refresh": "5s"
    }
  }

